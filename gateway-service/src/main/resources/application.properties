spring.application.name=gateway-service

server.port=${PORT:8080}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}

# Auth (Public API)
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

# Expense
spring.cloud.gateway.server.webflux.routes[1].id=expense-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://expense-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/expenses/**

# Income
spring.cloud.gateway.server.webflux.routes[2].id=income-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://income-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/incomes/**

# Category
spring.cloud.gateway.server.webflux.routes[3].id=category-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://category-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/categories/**

# Budget
spring.cloud.gateway.server.webflux.routes[4].id=budget-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://budget-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/budgets/**

# Analytics
spring.cloud.gateway.server.webflux.routes[5].id=analytics-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://analytics-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/analytics/**

# Notification
spring.cloud.gateway.server.webflux.routes[6].id=notification-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/notifications/**

# Auth 
spring.cloud.gateway.server.webflux.routes[7].id=auth-api
spring.cloud.gateway.server.webflux.routes[7].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/**

logging.level.org.springframework.cloud.gateway=INFO