spring.application.name=gateway-service

server.port=${PORT:8080}

# ==================================================
# EUREKA
# ==================================================
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}

# ==================================================
# AUTH SERVICE - SWAGGER DOCS (KEEP FIRST)
# ==================================================
spring.cloud.gateway.server.webflux.routes[0].id=auth-service-docs
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/v3/api-docs
spring.cloud.gateway.server.webflux.routes[0].filters[0]=SetPath=/v3/api-docs

# ==================================================
# AUTH SERVICE - APIs
# ==================================================
spring.cloud.gateway.server.webflux.routes[1].id=auth-service-api
spring.cloud.gateway.server.webflux.routes[1].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/auth/**

# ==================================================
# EXPENSE SERVICE
# ==================================================
spring.cloud.gateway.server.webflux.routes[2].id=expense-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://expense-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/expenses/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=RewritePath=/api/expenses/(?<segment>.*), /${segment}

# ==================================================
# INCOME SERVICE
# ==================================================
spring.cloud.gateway.server.webflux.routes[3].id=income-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://income-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/incomes/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=RewritePath=/api/incomes/(?<segment>.*), /${segment}

# ==================================================
# CATEGORY SERVICE
# ==================================================
spring.cloud.gateway.server.webflux.routes[4].id=category-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://category-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/categories/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=RewritePath=/api/categories/(?<segment>.*), /${segment}

# ==================================================
# BUDGET SERVICE
# ==================================================
spring.cloud.gateway.server.webflux.routes[5].id=budget-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://budget-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/budgets/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=RewritePath=/api/budgets/(?<segment>.*), /${segment}

# ==================================================
# ANALYTICS SERVICE
# ==================================================
spring.cloud.gateway.server.webflux.routes[6].id=analytics-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://analytics-service
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/analytics/**
spring.cloud.gateway.server.webflux.routes[6].filters[0]=RewritePath=/api/analytics/(?<segment>.*), /${segment}

# ==================================================
# NOTIFICATION SERVICE
# ==================================================
spring.cloud.gateway.server.webflux.routes[7].id=notification-service
spring.cloud.gateway.server.webflux.routes[7].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.server.webflux.routes[7].filters[0]=RewritePath=/api/notifications/(?<segment>.*), /${segment}

# ==================================================
# RECURRING SERVICE
# ==================================================
spring.cloud.gateway.server.webflux.routes[8].id=recurring-service
spring.cloud.gateway.server.webflux.routes[8].uri=lb://recurring-service
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/api/recurring/**
spring.cloud.gateway.server.webflux.routes[8].filters[0]=RewritePath=/api/recurring/(?<segment>.*), /${segment}

# ==================================================
# CENTRAL SWAGGER UI
# ==================================================
springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.urls[0].name=auth-service
springdoc.swagger-ui.urls[0].url=/auth/v3/api-docs

springdoc.swagger-ui.urls[1].name=expense-service
springdoc.swagger-ui.urls[1].url=/api/expenses/v3/api-docs

springdoc.swagger-ui.urls[2].name=income-service
springdoc.swagger-ui.urls[2].url=/api/incomes/v3/api-docs

springdoc.swagger-ui.urls[3].name=category-service
springdoc.swagger-ui.urls[3].url=/api/categories/v3/api-docs

springdoc.swagger-ui.urls[4].name=budget-service
springdoc.swagger-ui.urls[4].url=/api/budgets/v3/api-docs

springdoc.swagger-ui.urls[5].name=analytics-service
springdoc.swagger-ui.urls[5].url=/api/analytics/v3/api-docs

springdoc.swagger-ui.urls[6].name=notification-service
springdoc.swagger-ui.urls[6].url=/api/notifications/v3/api-docs

springdoc.swagger-ui.urls[7].name=recurring-service
springdoc.swagger-ui.urls[7].url=/api/recurring/v3/api-docs

# ==================================================
# LOGGING
# ==================================================
logging.level.org.springframework.cloud.gateway=INFO