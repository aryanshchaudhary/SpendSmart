spring.application.name=gateway-service

server.address=0.0.0.0
server.port=${PORT:8080}

spring.main.web-application-type=reactive

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:https://spendsmart-service-registry.onrender.com/eureka}

eureka.instance.hostname=spendsmart-gateway.onrender.com
eureka.instance.prefer-ip-address=true

# =========================================
# GLOBAL CORS CONFIG
# =========================================
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=https://spend-smart-frontend-silk.vercel.app
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

# =========================================
# AUTH SERVICE ROUTES
# =========================================
spring.cloud.gateway.routes[0].id=auth-service-docs
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/v3/api-docs
spring.cloud.gateway.routes[0].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.routes[1].id=auth-service-api
spring.cloud.gateway.routes[1].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/auth/**

# =========================================
# EXPENSE SERVICE
# =========================================
spring.cloud.gateway.routes[2].id=expense-service
spring.cloud.gateway.routes[2].uri=lb://EXPENSE-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/expenses/**

# =========================================
# INCOME SERVICE
# =========================================
spring.cloud.gateway.routes[3].id=income-service
spring.cloud.gateway.routes[3].uri=lb://INCOME-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/incomes/**

# =========================================
# CATEGORY SERVICE
# =========================================
spring.cloud.gateway.routes[4].id=category-service
spring.cloud.gateway.routes[4].uri=lb://CATEGORY-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/categories/**

# =========================================
# BUDGET SERVICE
# =========================================
spring.cloud.gateway.routes[5].id=budget-service
spring.cloud.gateway.routes[5].uri=lb://BUDGET-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/budgets/**

# =========================================
# ANALYTICS SERVICE
# =========================================
spring.cloud.gateway.routes[6].id=analytics-service
spring.cloud.gateway.routes[6].uri=lb://ANALYTICS-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/analytics/**

# =========================================
# NOTIFICATION SERVICE
# =========================================
spring.cloud.gateway.routes[7].id=notification-service
spring.cloud.gateway.routes[7].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/notifications/**

# =========================================
# RECURRING SERVICE
# =========================================
spring.cloud.gateway.routes[8].id=recurring-service
spring.cloud.gateway.routes[8].uri=lb://RECURRING-SERVICE
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/recurring/**

# =========================================
# SWAGGER UI
# =========================================
springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.urls[0].name=auth-service
springdoc.swagger-ui.urls[0].url=/auth/v3/api-docs

springdoc.swagger-ui.urls[1].name=expense-service
springdoc.swagger-ui.urls[1].url=/api/expenses/v3/api-docs

springdoc.swagger-ui.urls[2].name=income-service
springdoc.swagger-ui.urls[2].url=/api/incomes/v3/api-docs

springdoc.swagger-ui.urls[3].name=category-service
springdoc.swagger-ui.urls[3].url=/api/categories/v3/api-docs

springdoc.swagger-ui.urls[4].name=budget-service
springdoc.swagger-ui.urls[4].url=/api/budgets/v3/api-docs

springdoc.swagger-ui.urls[5].name=analytics-service
springdoc.swagger-ui.urls[5].url=/api/analytics/v3/api-docs

springdoc.swagger-ui.urls[6].name=notification-service
springdoc.swagger-ui.urls[6].url=/api/notifications/v3/api-docs

springdoc.swagger-ui.urls[7].name=recurring-service
springdoc.swagger-ui.urls[7].url=/api/recurring/v3/api-docs

# =========================================
# LOGGING
# =========================================
logging.level.org.springframework.cloud.gateway=INFO
logging.level.reactor.netty.http.client=DEBUG