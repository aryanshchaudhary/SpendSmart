spring.application.name=gateway-service

server.port=${PORT:8080}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}

# Auth (Public API)
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

# Expense
spring.cloud.gateway.server.webflux.routes[1].id=expense-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://expense-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/expenses/**

# Auth 
spring.cloud.gateway.server.webflux.routes[2].id=auth-api
spring.cloud.gateway.server.webflux.routes[2].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/**

logging.level.org.springframework.cloud.gateway=INFO