spring.application.name=gateway-service

server.port=${PORT:8080}

spring.main.web-application-type=reactive

# =========================================
# EUREKA
# =========================================
eureka.client.service-url.defaultZone=https://spendsmart-service-registry.onrender.com/eureka/

eureka.instance.prefer-ip-address=true

# =========================================
# GLOBAL CORS
# =========================================
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=https://spend-smart-frontend-silk.vercel.app

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

# =========================================
# AUTH SERVICE
# =========================================
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

# =========================================
# EXPENSE SERVICE
# =========================================
spring.cloud.gateway.routes[1].id=expense-service
spring.cloud.gateway.routes[1].uri=lb://EXPENSE-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/expenses/**

# =========================================
# INCOME SERVICE
# =========================================
spring.cloud.gateway.routes[2].id=income-service
spring.cloud.gateway.routes[2].uri=lb://INCOME-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/incomes/**

# =========================================
# CATEGORY SERVICE
# =========================================
spring.cloud.gateway.routes[3].id=category-service
spring.cloud.gateway.routes[3].uri=lb://CATEGORY-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/categories/**

# =========================================
# BUDGET SERVICE
# =========================================
spring.cloud.gateway.routes[4].id=budget-service
spring.cloud.gateway.routes[4].uri=lb://BUDGET-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/budgets/**

# =========================================
# ANALYTICS SERVICE
# =========================================
spring.cloud.gateway.routes[5].id=analytics-service
spring.cloud.gateway.routes[5].uri=lb://ANALYTICS-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/analytics/**

# =========================================
# NOTIFICATION SERVICE
# =========================================
spring.cloud.gateway.routes[6].id=notification-service
spring.cloud.gateway.routes[6].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/notifications/**

# =========================================
# RECURRING SERVICE
# =========================================
spring.cloud.gateway.routes[7].id=recurring-service
spring.cloud.gateway.routes[7].uri=lb://RECURRING-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/recurring/**

# =========================================
# LOGGING
# =========================================
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty=DEBUG